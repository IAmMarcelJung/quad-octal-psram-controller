# Files with dependencies are set up to be linted by the verilator CI job
# Optional "params" are passed to verilator as -G<NAME>=<VALUE> (integer values only)
groups:
  - top: OctalMemoryController_quad
    files: 
      - src/OctalMemoryController_quad.v
      - src/OSPIController_quad.v 
      - src/OctalSPI_quad.v
      - src/AXI4Subordinate.v
  # Tapeout configuration (APMemory), the default CHIP_TYPE=-1 is never built
  - top: OctalMemoryController_quad
    params:
      - CHIP_TYPE=2
    files:
      - src/OctalMemoryController_quad.v
      - src/OSPIController_quad.v
      - src/OctalSPI_quad.v
      - src/AXI4Subordinate.v
  # Read data FIFO enabled (not the tapeout setting, which keeps R_FIFO_DEPTH = 0), so the FIFO code is linted too
  - top: OctalMemoryController_quad
    params:
      - CHIP_TYPE=2
      - R_FIFO_DEPTH=16
    files:
      - src/OctalMemoryController_quad.v
      - src/OSPIController_quad.v
      - src/OctalSPI_quad.v
      - src/AXI4Subordinate.v
