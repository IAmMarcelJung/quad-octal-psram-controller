name: Formatting

on:
  push:
    branches: [main]
  pull_request:

jobs:
  format:
    runs-on: ubuntu-latest
    env:
      # same versions as in the nix shell (flake.nix)
      BLACK_VERSION: 25.1.0
      VERIBLE_VERSION: v0.0-4023-gc1271a00
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v5
      - name: Install black and verible
        run: |
          python -m pip install "black==${BLACK_VERSION}"
          curl -sSL "https://github.com/chipsalliance/verible/releases/download/${VERIBLE_VERSION}/verible-${VERIBLE_VERSION}-linux-static-x86_64.tar.gz" | tar -xz -C "${RUNNER_TEMP}"
          echo "${RUNNER_TEMP}/verible-${VERIBLE_VERSION}/bin" >> "${GITHUB_PATH}"
      - name: Check Python formatting (black)
        run: black --check --diff -l 100 $(git ls-files '*.py')
      - name: Check Verilog formatting (verible)
        run: |
          status=0
          for f in $(git ls-files '*.v' '*.sv'); do
            verible-verilog-format --indentation_spaces 4 --verify "$f" || { echo "not formatted: $f"; status=1; }
          done
          exit $status
